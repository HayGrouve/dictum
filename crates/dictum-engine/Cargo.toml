[package]
name = "dictum-engine"
description = "Local speech-to-text engine for Dictum: Parakeet TDT + Silero VAD on ONNX Runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "api-24"] }
sha2 = "0.11"
ureq = { version = "3", default-features = false }

# Hardware acceleration: DirectML (any DX12 GPU) on Windows, CoreML on macOS.
# Model downloads use the OS TLS stack and certificate store there (no C toolchain needed).
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["directml"] }
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"] }
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
claxon = "0.4"
hound = "3.5"
